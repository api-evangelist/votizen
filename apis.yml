name: Votizen
description: Votizen was a Silicon Valley civic-technology startup (founded 2010 by David Binetti,
  Jason Putorti, and Matt Snider; a 500 Global portfolio company) that built a social network of
  verified U.S. voters and offered an API for candidates, offices, districts, races, and voter
  contact tracking. Votizen was acquired by Causes in 2013 and shut down; votizen.com now serves
  only a bare default web server page, and no live API, developer portal, packages, or security
  program remains.
